<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>WebGL Fluid Simulation</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#D39DB6}
body:before{
 content:"";position:fixed;inset:0;z-index:-1;
 background:
 radial-gradient(circle at 20% 25%,#F88B88 0,transparent 32%),
 radial-gradient(circle at 80% 70%,#A18EC8 0,transparent 34%),
 radial-gradient(circle at 55% 45%,#F0D1A9 0,transparent 28%),
 #D39DB6
}
body.embed{background:transparent}
body.embed:before{display:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>

<script src="https://cdn.jsdelivr.net/npm/webgl-fluid@0.3/dist/webgl-fluid.umd.js"></script>
</head>

<body>

<canvas id="fluid-canvas"></canvas>

<script>
const canvas=document.getElementById("fluid-canvas");

if(new URLSearchParams(location.search).has("embed"))
 document.body.classList.add("embed");

WebGLFluid(canvas,{
 IMMEDIATE:true,
 TRIGGER:"hover",

 SIM_RESOLUTION:128,
 DYE_RESOLUTION:1024,
 CAPTURE_RESOLUTION:512,

 DENSITY_DISSIPATION:1,
 VELOCITY_DISSIPATION:0.3,

 PRESSURE:0.8,
 PRESSURE_ITERATIONS:20,
 CURL:30,

 SPLAT_RADIUS:0.25,
 SPLAT_FORCE:6000,

 SHADING:true,
 COLORFUL:true,
 COLOR_UPDATE_SPEED:10,

 PAUSED:false,

 BACK_COLOR:{r:0,g:0,b:0},
 TRANSPARENT:true,

 BLOOM:true,
 BLOOM_ITERATIONS:8,
 BLOOM_RESOLUTION:256,
 BLOOM_INTENSITY:0.8,
 BLOOM_THRESHOLD:0.6,
 BLOOM_SOFT_KNEE:0.7,

 SUNRAYS:true,
 SUNRAYS_RESOLUTION:196,
 SUNRAYS_WEIGHT:1
});
</script>

</body>
</html>
